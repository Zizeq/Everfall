<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everfall: A Visual Novel</title>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- All screen containers are placed here -->
    <div class="main-menu-container visible" id="main-menu"></div>
    <div class="game-container" id="game-container"></div>
    <div id="modal-backdrop" class="modal-backdrop"></div>
    <div class="sub-screen" id="settings-screen"></div>
    <div class="sub-screen" id="controls-screen"></div>
    <div class="sub-screen" id="about-screen"></div>
    <div class="save-load-screen" id="save-load-screen"></div>
    <div class="journal-container" id="journal-container">
        <!-- The flipbook will be built inside this div by the script -->
    </div>

    <!-- Dialogue Log, Achievements, and Inventory Screens -->
    <div id="dialogue-log-screen" class="sub-screen dialogue-log-screen"></div>
    <div id="inventory-screen" class="sub-screen inventory-screen"></div>
    
    <!-- Extras Menu and Galleries -->
    <div class="sub-screen" id="extras-screen"></div>
    <div class="sub-screen" id="achievements-screen"></div>
    <div class="sub-screen" id="cg-gallery-screen"></div>
    <div class="sub-screen" id="music-room-screen"></div>

    <!-- Feature Screens (World Map, Cooking) -->
    <div class="sub-screen" id="world-map-screen"></div>
    <div class="sub-screen" id="cooking-screen"></div>


    <audio id="background-music" loop></audio>
    <div id="notification-popup" class="notification-popup"></div>

    <script type="text/javascript" src="jquery.js"></script>
    <script type="text/javascript" src="turn.js"></script>
    
    <!-- Your main game script -->
    <script src="script.js"></script>
</body>
</html>
